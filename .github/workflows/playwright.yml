name: Playwright CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-gate:
    name: API Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Clean previous reports
        run: npm run report:clean

      - name: Run API gate
        run: npm run test:api

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload API gate reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-gate-reports
          path: |
            reports/playwright-report
            reports/allure-results
            reports/allure-report
            test-results
          if-no-files-found: warn

  stage-gate:
    name: Stage Gate (Diagnostic)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Clean previous reports
        run: npm run report:clean

      - name: Run diagnostic UI stage gate
        run: npm run test:ui:stage

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload stage gate reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stage-gate-reports
          path: |
            reports/playwright-report
            reports/allure-results
            reports/allure-report
            test-results
          if-no-files-found: warn
